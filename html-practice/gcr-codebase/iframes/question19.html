<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q19 Form Security</title>
</head>
<body>

    <h2>Secure Form Example</h2>

    <form method="post" action="#" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <p>Turning off autocomplete stops the browser from saving and auto-filling sensitive details like passwords, which helps prevent this data from being seen or misused by someone else using the same device.</p>

</body>
</html>

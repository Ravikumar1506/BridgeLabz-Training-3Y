<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Iframes</title>
</head>
<body>

    <h2>Introduction Page</h2>
    <!-- first iframe shows my intro page -->
    <iframe 
        src="data:text/html,<h2>About Me</h2><p>Hi, my name is Ravi Kumar. I am a student at GLA University, Mathura.</p>" 
        title="Introduction Page"
        width="80%" 
        height="200">
    </iframe>

    <h2>Hobby Page</h2>
    <!-- second iframe shows my hobby page, same width and height so both look balanced -->
    <iframe 
        src="data:text/html,<h2>My Favorite Hobby</h2><p>My favorite hobby is reading books. I like reading story books and novels in my free time.</p>" 
        title="Hobby Page"
        width="80%" 
        height="200">
    </iframe>

</body>
</html>

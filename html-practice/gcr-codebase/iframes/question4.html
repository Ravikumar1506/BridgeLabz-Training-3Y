<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q4 Frameset</title>
</head>

<!-- top frame is nav links, bottom frame shows welcome message -->
<frameset rows="20%,80%">
    <frame src="data:text/html,<a href='#'>Home</a> <a href='#'>About</a> <a href='#'>Contact</a>" title="Navigation Links">
    <frame src="data:text/html,<h2>Welcome to My Website</h2>" title="Welcome Message">
</frameset>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q18 Quotations</title>
</head>
<body>

    <h2>Quotations Example</h2>

    <!-- long quote using blockquote -->
    <blockquote>
        Hard work and dedication are the real keys to success. No shortcut can replace the value of consistent effort put in every single day.
    </blockquote>

    <!-- short quote using q tag, entity &amp; used inside -->
    <p>My teacher always says <q>practice &amp; patience make everything possible</q> and I try to remember that.</p>

</body>
</html>

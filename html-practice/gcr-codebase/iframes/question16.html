<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q16 URI Encoding</title>
</head>
<body>

    <h2>URI Encoding Example</h2>

    <p>Original URL: https://example.com/search?query=HTML & CSS</p>

    <!-- spaces in the url are replaced with %20 to make it a valid encoded url -->
    <a href="https://example.com/search?query=HTML%20&%20CSS">Encoded Link</a>

</body>
</html>

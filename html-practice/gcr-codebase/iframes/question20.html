<!DOCTYPE html>
<html lang="en">
<head>

    <!-- title shows the name of the page on the browser tab -->
    <title>Q20 Head Elements</title>

    <!-- meta charset sets the character encoding of the page -->
    <meta charset="UTF-8">

    <!-- meta description gives a short summary of the page, used by search engines -->
    <meta name="description" content="A demo page showing all important head elements.">

    <!-- meta author tells who made this page -->
    <meta name="author" content="Ravi  Kumar">

    <!-- base sets the default url for all relative links and resources on this page -->
    <base href="https://example.com/">

    <!-- link connects an external resource, here it links a favicon icon -->
    <link rel="icon" href="favicon.ico">

    <!-- style tag is for internal css, kept empty as css is not used in this assignment -->
    <style>
    </style>

    <!-- script tag is for javascript, kept empty as js is not used in this assignment -->
    <script>
    </script>

</head>
<body>

    <h2>Head Elements Demo</h2>
    <p>This page shows all the important tags used inside the head section.</p>

</body>
</html>

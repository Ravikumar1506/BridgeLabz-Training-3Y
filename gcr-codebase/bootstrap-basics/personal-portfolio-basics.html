<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="personal-portfolio-basics.css">
</head>
<body class="bg-light text-dark">

<header class="container text-center mt-4 mb-3">
    <h1 class="fw-bold">Ravi Kumar</h1>
    <p class="lead">Web Developer &amp; Technology Enthusiast</p>
</header>

<main>
    <section class="container text-center p-5 bg-white rounded shadow-sm">
        <img
            
            alt="Profile"
            class="img-fluid rounded-circle profile-image mb-4">

        <h2 class="fw-bold">Hello, I'm Ravi</h2>
        <p class="mb-4">I create clean, responsive and user-friendly websites.</p>

        <div class="mb-4">
            <a href="#" class="btn btn-primary me-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark">Download CV</a>
        </div>

        <form class="mx-auto contact-form">
            <h3 class="fw-bold mb-3">Contact Me</h3>
            <!-- form-control gives Bootstrap styling to inputs -->
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="email" class="form-control mb-3" placeholder="Your Email">
            <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>
            <button type="submit" class="btn btn-dark">Send Message</button>
        </form>
    </section>
</main>

<footer class="text-center py-4 mt-4">
    <p class="mb-0">© 2026 Ravi Kumar</p>
</footer>

</body>
</html>

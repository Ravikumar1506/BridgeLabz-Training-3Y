<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="task-tracker-with-badges.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white">
    <div class="container py-4 d-flex justify-content-between align-items-center">
        <div>
            <h1 class="h3 mb-1">Task Tracker</h1>
            <p class="mb-0">Manage your daily work</p>
        </div>
        <!-- Bootstrap badge displays pending count -->
        <span class="badge bg-danger fs-6">4 Pending</span>
    </div>
</header>

<main class="container py-5">
    <section>
        <h2 class="mb-4">My Tasks</h2>

        <!-- Bootstrap list-group displays tasks -->
        <div class="list-group shadow-sm">
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Finish project report</span>
                <span class="badge bg-danger rounded-pill">High</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Review database notes</span>
                <span class="badge bg-warning text-dark rounded-pill">Medium</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Update portfolio</span>
                <span class="badge bg-success rounded-pill">Low</span>
            </div>

            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>Practice Bootstrap</span>
                <span class="badge bg-warning text-dark rounded-pill">Medium</span>
            </div>
        </div>

        <div class="text-center mt-4">
            <!-- Button contains an embedded badge -->
            <button class="btn btn-success">
                Completed <span class="badge bg-light text-success">2</span>
            </button>
        </div>
    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">Task Tracker Practice</p>
</footer>

</body>
</html>

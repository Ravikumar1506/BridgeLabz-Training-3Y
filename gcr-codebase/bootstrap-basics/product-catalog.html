<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body class="bg-light">

<header class="bg-dark text-white text-center py-4">
    <h1 class="fw-bold">Tech Store</h1>
    <p class="mb-0">Smart products for everyday life</p>
</header>

<main class="container py-5">
    <section>
        <h2 class="text-center mb-4">Featured Products</h2>

        <div class="row g-4">
            <article class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b" class="card-img-top" alt="Headphones">
                    <div class="card-body text-center">
                        <h3 class="h5">Wireless Headphones</h3>
                        <p class="fw-bold">₹2,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </article>

            <article class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" class="card-img-top" alt="Smart Watch">
                    <div class="card-body text-center">
                        <h3 class="h5">Smart Watch</h3>
                        <p class="fw-bold">₹3,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </article>

            <article class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853" class="card-img-top" alt="Laptop">
                    <div class="card-body text-center">
                        <h3 class="h5">Slim Laptop</h3>
                        <p class="fw-bold">₹54,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </article>

            <article class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" class="card-img-top" alt="Smartphone">
                    <div class="card-body text-center">
                        <h3 class="h5">Smartphone</h3>
                        <p class="fw-bold">₹24,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 Tech Store</p>
</footer>

</body>
</html>

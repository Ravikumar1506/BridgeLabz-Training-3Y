<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>

    <header>
        <h1>Gradient Background Page</h1>
    </header>

    <main>
        <section class="linear-gradient">
            <div>
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient background.
                    The colors change smoothly from one direction to another.
                </p>
            </div>
        </section>

        <section class="radial-gradient">
            <div>
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient background.
                    The colors spread out from the center of the section.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
        <p>Examples of different CSS size units</p>
    </header>

    <main>
        <section class="boxes">

            <div class="box box-one">
                <h2>Box 1</h2>
                <p>Width: 200px</p>
                <p>Height: 150px</p>
            </div>

            <div class="box box-two">
                <h2>Box 2</h2>
                <p>Width: 40%</p>
                <p>Height: 12em</p>
            </div>

            <div class="box box-three">
                <h2>Box 3</h2>
                <p>Width: 30%</p>
                <p>Height: 30vh</p>
                <p>This box also demonstrates overflow.</p>
                <p>Extra content is hidden when it goes outside the box.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Height and Width Practice</p>
    </footer>

</body>
</html>

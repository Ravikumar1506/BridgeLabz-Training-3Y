<!DOCTYPE html>
<html lang="en">
<head>

    <title>Advanced CSS Selectors</title>

</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
        <p>Practice with different types of CSS selectors</p>
    </header>

    <main>

            <ul>
                <li>HTML</li>

            <a href="https://www.google.com">Google</a>

            <form>
                <input type="text" placeholder="Enter your name">

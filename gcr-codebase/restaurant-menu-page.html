<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Menu - Spice Garden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="restaurant-menu-page.css">
</head>
<body>

<header class="bg-dark text-white text-center py-5">
    <div class="container">
        <h1>Spice Garden</h1>
        <p class="lead mb-0">Today's Menu</p>
    </div>
</header>

<main class="container py-5">
    <section class="mb-5">
        <h2 class="text-center mb-4">Menu</h2>

        <!-- Bootstrap table gives responsive-ready table styling -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Paneer Tikka</td><td>Starter</td><td>₹220</td></tr>
                    <tr><td>Veg Biryani</td><td>Main Course</td><td>₹280</td></tr>
                    <tr><td>Butter Naan</td><td>Bread</td><td>₹60</td></tr>
                    <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹100</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="row g-4">
        <div class="col-md-6">
            <h2 class="text-center mb-3">Chef's Specials</h2>
            <!-- list-group is a Bootstrap component -->
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between">Dal Makhani <span>₹240</span></li>
                <li class="list-group-item d-flex justify-content-between">Malai Kofta <span>₹260</span></li>
                <li class="list-group-item d-flex justify-content-between">Tandoori Platter <span>₹420</span></li>
            </ul>
        </div>

        <div class="col-md-6">
            <figure class="text-center">
                <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950"
                     alt="Indian food" class="img-fluid rounded food-image">
                <figcaption class="mt-2 text-muted">Freshly prepared Indian specialties</figcaption>
            </figure>
        </div>
    </section>
</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 Spice Garden Restaurant</p>
</footer>

</body>
</html>

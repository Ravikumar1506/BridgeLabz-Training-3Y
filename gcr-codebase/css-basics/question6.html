<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>

    <link rel="stylesheet" href="question6.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Some beautiful places and moments</p>
    </header>

    <main>
        <section class="gallery">

            <div class="photo">
                <img src="image1.jpg" alt="Beautiful mountain">
                <div class="caption">Beautiful Mountains</div>
            </div>

            <div class="photo">
                <img src="image2.jpg" alt="Beautiful beach">
                <div class="caption">Peaceful Beach</div>
            </div>

            <div class="photo">
                <img src="image3.jpg" alt="Green forest">
                <div class="caption">Green Forest</div>
            </div>

            <div class="photo">
                <img src="image4.jpg" alt="Beautiful city">
                <div class="caption">Beautiful City</div>
            </div>

            <div class="photo">
                <img src="image5.jpg" alt="Sunset view">
                <div class="caption">Amazing Sunset</div>
            </div>

            <div class="photo">
                <img src="image6.jpg" alt="Beautiful lake">
                <div class="caption">Peaceful Lake</div>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery. All Rights Reserved.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur"
                     src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                     alt="Nature">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="grayscale"
                     src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                     alt="Mountain">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia"
                     src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                     alt="Beach">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="brightness"
                     src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                     alt="Forest">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast"
                     src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df"
                     alt="City">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue"
                     src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                     alt="Landscape">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Image Filter Gallery</p>
    </footer>

</body>
</html>

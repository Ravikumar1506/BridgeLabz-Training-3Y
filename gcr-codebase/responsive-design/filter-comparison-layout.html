<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <header>
        <h1>Filter Comparison</h1>
        <p>Before and After CSS Filter Comparison</p>
    </header>

    <main>
        <section class="comparison">

            <!-- Before Image -->
            <figure class="image-box">
                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                    alt="Original landscape image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <!-- After Image -->
            <figure class="image-box">
                <img
                    class="filtered-image"
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                    alt="Filtered landscape image">
                <figcaption>After - Brightness Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Filter Comparison Practice</p>
    </footer>

</body>
</html>

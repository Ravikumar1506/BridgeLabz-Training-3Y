<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip-item">
                <span class="icon">★</span>
                <span class="tooltip">This is a star</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">?</span>
                <span class="tooltip">Help information</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">i</span>
                <span class="tooltip">More information</span>
            </div>

            <div class="tooltip-item">
                <span class="icon">✓</span>
                <span class="tooltip">Completed successfully</span>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Tooltip Practice</p>
    </footer>

</body>
</html>

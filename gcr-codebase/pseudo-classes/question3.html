<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <div class="image-box">
                    <img src="image1.jpg" alt="Nature">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="image2.jpg" alt="Mountain">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="image3.jpg" alt="Beach">
                    <div class="overlay"></div>
                </div>
                <figcaption>Peaceful Beach</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="image4.jpg" alt="Forest">
                    <div class="overlay"></div>
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="image5.jpg" alt="City">
                    <div class="overlay"></div>
                </div>
                <figcaption>City View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="image6.jpg" alt="Sunset">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Sunset</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>CSS Image Showcase</p>
    </footer>

</body>
</html>

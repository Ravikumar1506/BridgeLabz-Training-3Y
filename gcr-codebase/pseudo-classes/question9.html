<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="question9.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
    </header>

    <main>
        <section class="effects">

            <article class="effect-card">
                <h2>Button Effect</h2>
                <button>Hover Me</button>
                <p>Hover changes color and size.</p>
            </article>

            <article class="effect-card">
                <h2>Card Effect</h2>
                <a href="#">Hover Link</a>
                <p>The card moves and gets a larger shadow.</p>
            </article>

            <article class="effect-card">
                <h2>Action Effect</h2>
                <button class="action-button">Click Me</button>
                <p>Focus and active states are also shown.</p>
            </article>

        </section>
    </main>

    <footer>
        <p>Combined CSS Effects Practice</p>
    </footer>

</body>
</html>
